services:
  service-sso-db-postgres:
    image: postgres:17-alpine
    container_name: sso-db-postgres
    environment:
      - POSTGRES_DB=$POSTGRES_DB
      - POSTGRES_USER=$POSTGRES_USER
      - POSTGRES_PASSWORD=$POSTGRES_PASSWORD
    ports:
      - "$POSTGRES_PORT:5432"
    volumes:
      - pgdata-service-sso:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: always
  migrate-sso:
    image: migrate/migrate
    container_name: migrate-sso
    volumes:
      - ./migrations:/migrations
    command:
      [
        "-path", "/migrations",
        "-database",
        "postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${POSTGRES_HOST}/${POSTGRES_DB}?sslmode=disable",
        "up"
      ]
    depends_on:
      service-sso-db-postgres:
        condition: service_healthy
    restart: "no"
  service-sso-app-go:
    build:
      context: .
      dockerfile: Dockerfile-go
    image: aygumov-g/service-sso-app-go:latest
    container_name: sso-app-go
    environment:
      - APP_PORT=$APP_PORT
      - POSTGRES_HOST=$POSTGRES_HOST
      - POSTGRES_USER=$POSTGRES_USER
      - POSTGRES_PASSWORD=$POSTGRES_PASSWORD
      - POSTGRES_DB=$POSTGRES_DB
      - JWT_SECRET=$JWT_SECRET
      - JWT_TTL=$JWT_TTL
      - REFRESH_TTL=$REFRESH_TTL
    ports:
      - "$APP_PORT:$APP_PORT"
    depends_on:
      service-sso-db-postgres:
        condition: service_healthy
      migrate-sso:
        condition: service_completed_successfully

volumes:
  pgdata-service-sso:
